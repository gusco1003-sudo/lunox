 <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>루녹스 정산 조회 (화주용)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="date"], select { font-size: 16px !important; }
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 p-2 sm:p-4 md:p-8 relative mt-4">

    <div id="appContent">
        <div id="cloudStatus" class="fixed top-0 left-0 w-full bg-blue-600 text-white text-[10px] font-bold text-center py-1 z-50 transition-colors">
            ☁️ 정산 데이터 조회 중...
        </div>

        <div class="max-w-5xl mx-auto bg-white p-3 sm:p-5 md:p-6 rounded-lg sm:rounded-xl shadow-lg mt-2">
            <h1 class="text-lg sm:text-2xl font-bold text-gray-800 mb-3 sm:mb-6 flex items-center gap-2">
                📦 <span>루녹스 정산 조회</span>
                <span class="text-[11px] sm:text-xs bg-gray-100 text-gray-500 font-bold px-2 py-1 rounded-full border">조회 전용</span>
            </h1><div class="flex justify-end mb-3"><button type="button" id="refreshGuest" onclick="fetchData()" class="border border-blue-200 text-blue-700 bg-blue-50 rounded-lg px-4 py-2 text-sm font-bold">새로고침</button></div>
            
            <div class="bg-gradient-to-br from-blue-700 to-indigo-800 rounded-xl p-4 sm:p-6 mb-4 sm:mb-6 text-white shadow-md">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-3 sm:mb-4 pb-3 border-b border-blue-600 gap-2">
                    <h2 class="text-base sm:text-lg font-bold flex items-center gap-2 text-white">📊 월별 통합 정산</h2>
                    <select aria-label="정산월" id="monthSelector" onchange="handleMonthChange()" class="bg-blue-900 text-white font-bold border border-blue-500 rounded-md px-3 py-2 sm:py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer shadow-sm w-full sm:w-auto"></select>
                </div>
                <div class="mb-3 sm:mb-4">
                    <h3 class="text-xs sm:text-sm font-semibold text-blue-200 mb-1">선택한 월 정산 금액 (부가세 별도)</h3>
                    <div class="text-3xl sm:text-4xl font-extrabold leading-tight"><span id="monthlyTotalRevenue">—</span> <span class="text-base sm:text-xl font-normal opacity-80">원</span></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-3 bg-black bg-opacity-20 p-3 sm:p-4 rounded-lg">
                    <button type="button" id="viewStorage" onclick="openStorageModal()" class="flex justify-between sm:block items-center cursor-pointer hover:bg-black hover:bg-opacity-10 p-1.5 rounded-lg transition" title="클릭하시면 상세 일별 보관 내역을 보실 수 있습니다.">
                        <p class="text-xs text-blue-200 mb-0 sm:mb-1">📦 보관료 (700원/PLT·일) <span class="text-white ml-1">🔍</span></p>
                        <p class="text-base sm:text-lg font-bold"><span id="monthlyStorageFee">—</span> 원</p>
                    </button>
                    <button type="button" id="viewOut" onclick="openInOutModal('OUT')" class="flex justify-between sm:block items-center border-t sm:border-t-0 border-blue-600 border-opacity-30 pt-2 sm:pt-0 cursor-pointer hover:bg-black hover:bg-opacity-10 p-1.5 rounded-lg transition" title="클릭하시면 상세 출고 내역을 보실 수 있습니다.">
                        <p class="text-xs text-blue-200 mb-0 sm:mb-1">🚚 출고비 <span class="text-white ml-1">🔍</span></p>
                        <p class="text-base sm:text-lg font-bold"><span id="monthlyOutFee">—</span> 원</p>
                    </button>
                    <button type="button" id="viewIn" onclick="openInOutModal('IN')" class="flex justify-between sm:block items-center border-t sm:border-t-0 border-blue-600 border-opacity-30 pt-2 sm:pt-0 cursor-pointer hover:bg-black hover:bg-opacity-10 p-1.5 rounded-lg transition" title="클릭하시면 상세 입고 내역을 보실 수 있습니다.">
                        <p class="text-xs text-blue-200 mb-0 sm:mb-1">📥 입고비 <span class="text-white ml-1">🔍</span></p>
                        <p class="text-base sm:text-lg font-bold"><span id="monthlyInFee">—</span> 원</p>
                    </button>
                </div>
            </div>

            <div class="mb-3 flex justify-between items-center gap-2">
                <h3 class="text-base sm:text-lg font-bold text-gray-800">📋 실시간 현재고</h3>
                <span class="text-xs bg-amber-50 px-3 py-1.5 rounded-md border border-amber-200 font-bold text-center text-amber-800" id="todayPltBadge">계산중...</span>
            </div>

            <label for="inventorySearch" class="text-xs font-bold text-gray-600">품목명 검색</label><input type="search" id="inventorySearch" oninput="renderInventory()" placeholder="품목명으로 현재고 검색" class="border rounded-lg p-2 mb-3 w-full">
<div class="hidden md:block overflow-x-auto mb-8">
                <table class="w-full text-left border-collapse bg-white border rounded-md">
                    <thead><tr class="bg-gray-800 text-white text-sm"><th class="p-3">품목명</th><th class="p-3 text-right">현재고 (박스)</th><th class="p-3 text-right">현재고 (낱개)</th><th class="p-3 text-center text-gray-300">규격 (1PLT)</th><th class="p-3 text-center text-amber-400">당일 마감기준 PLT</th></tr></thead>
                    <tbody id="inventoryTable" class="text-gray-700 divide-y"></tbody>
                </table>
            </div>
            <div id="inventoryCards" class="md:hidden grid grid-cols-1 gap-2 mb-5"></div>

            <div>
                <div class="flex flex-col gap-2 mb-3">
                    <h3 class="text-base font-bold text-gray-800">🔍 <span id="logTitleMonth" class="text-blue-600"></span> 입출고 내역</h3>
                    <div class="flex flex-wrap sm:items-center gap-2 bg-gray-50 p-2 rounded-lg border">
                        <input type="date" id="searchDate" aria-label="조회일" class="border bg-white p-1.5 text-sm rounded cursor-pointer flex-1 sm:flex-none outline-none" onchange="handleDateChange()">
                        <button onclick="resetHistoryFilters()" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded font-medium flex-1 sm:flex-none transition">조건 초기화</button>
                    </div>
                </div>
                <div class="flex flex-wrap items-center gap-2 mb-3"><select id="historyType" aria-label="입출고 구분" onchange="renderLogs()" class="border p-2 rounded-lg"><option value="ALL">입출고 전체</option><option value="IN">입고</option><option value="OUT">출고</option></select><input type="search" id="historySearch" aria-label="내역 검색" oninput="renderLogs()" placeholder="품목·메모 검색" class="border p-2 rounded-lg flex-1 min-w-0"><span id="historyCount" class="text-xs text-gray-500"></span></div><div id="logContainer" class="bg-gray-50 p-2 sm:p-4 rounded-lg max-h-80 overflow-y-auto text-sm text-gray-600 border shadow-inner"></div>
            </div>
        </div>
    </div>

    <div id="storageModal" role="dialog" aria-modal="true" aria-labelledby="storageModalTitle" style="display:none;" class="fixed inset-0 bg-black bg-opacity-60 items-center justify-center z-50 p-3">
        <div class="bg-white p-4 sm:p-6 rounded-xl w-full max-w-md max-h-[85vh] flex flex-col shadow-2xl">
            <h2 id="storageModalTitle" class="text-lg font-bold mb-3 border-b pb-2">📋 보관료 내역</h2>
            <div class="flex-1 overflow-y-auto mb-4">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="bg-gray-100 border-b text-gray-600">
                        <tr><th class="p-2 w-24">날짜</th><th class="p-2 text-center">정산 파렛트</th><th class="p-2 text-right">보관료</th></tr>
                    </thead>
                    <tbody id="storageModalBody" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
            <div class="flex justify-end pt-3 border-t"><button id="storageClose" onclick="closeStorageModal()" class="bg-gray-800 text-white px-5 py-2 rounded-md text-sm font-bold">닫기</button></div>
        </div>
    </div>
    
    <div id="inOutModal" role="dialog" aria-modal="true" aria-labelledby="inOutModalTitle" style="display:none;" class="fixed inset-0 bg-black bg-opacity-60 items-center justify-center z-50 p-3">
        <div class="bg-white p-4 sm:p-6 rounded-xl w-full max-w-md max-h-[85vh] flex flex-col">
            <h2 id="inOutModalTitle" class="text-lg font-bold mb-3 border-b pb-2">상세 내역</h2>
            <div class="flex-1 overflow-y-auto mb-4">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="bg-gray-100 border-b">
                        <tr><th class="p-2 w-1/3">일시</th><th class="p-2">내역</th><th class="p-2 text-right">비용</th></tr>
                    </thead>
                    <tbody id="inOutModalBody" class="divide-y"></tbody>
                </table>
            </div>
            <div class="flex justify-end pt-3 border-t"><button id="inOutClose" onclick="closeInOutModal()" class="bg-gray-800 text-white px-5 py-2 rounded-md text-sm font-bold">닫기</button></div>
        </div>
    </div>

    <script>
'use strict';
const FIREBASE_URL="https://ts3pl-982ef-default-rtdb.firebaseio.com/lunox_data.json",CLIENT_NAME="루녹스",IS_LUNOX=true;
const DEFAULT_ITEMS=[
            { id: "big_lamp", name: "큰램프", box: 180, pltStd: 6, piece: 0, linkedItemId: null, linkedRatio: 1, optionKeyword: null, optionItemId: null },
            { id: "small_lamp", name: "작은램프", box: 153, pltStd: 48, piece: 0, linkedItemId: "packaging_box", linkedRatio: 1, optionKeyword: null, optionItemId: null },
            { id: "in_40ft", name: "40FT 컨테이너", box: 0, pltStd: 9999, piece: 0, linkedItemId: null, linkedRatio: 1, optionKeyword: null, optionItemId: null },
            { id: "packaging_box", name: "포장상자", box: 0, pltStd: 40, piece: 0, linkedItemId: null, linkedRatio: 1, optionKeyword: null, optionItemId: null },
            { id: "basic_bulb", name: "기본전구", box: 0, pltStd: 40, piece: 0, linkedItemId: null, linkedRatio: 1, optionKeyword: "스마트전구", optionItemId: "smart_bulb" },
            { id: "smart_bulb", name: "스마트전구", box: 0, pltStd: 40, piece: 0, linkedItemId: "basic_bulb", linkedRatio: 1, optionKeyword: null, optionItemId: null }
        ];
let inventory=[],logs=[],dailyPltLog={},manualStorageLog={};
let currentSelectedMonth=getFormattedDate().slice(0,7),loaded=false,fetching=false,lastSync='',activeDetail=null;
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('ko-KR');
const escapeText=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getFormattedDate(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function buildMonthlyStorage(month) {
            const series = {};
            if (!month) return series;

            const [year, mon] = month.split('-').map(Number);
            const today = new Date();
            const todayMonthStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
            const lastDayOfMonth = new Date(year, mon, 0).getDate();

            // 미래 월: 0일 / 이번 달: 오늘까지 / 지난 달: 말일까지
            let endDay = (month > todayMonthStr) ? 0 : (month === todayMonthStr ? today.getDate() : lastDayOfMonth);

            const monthStart = `${month}-01`;
            let runningInventory = null;

            // 이번 달 시작 직전의 마지막 기록을 시작 재고로 사용
            const priorDates = Object.keys(dailyPltLog).filter(d => d < monthStart).sort();
            if (priorDates.length) runningInventory = dailyPltLog[priorDates[priorDates.length - 1]];

            for (let day = 1; day <= endDay; day++) {
                const dStr = `${month}-${String(day).padStart(2,'0')}`;

                // 해당일 입출고량(이월 재고 추적용) 계산
                let outPlt = 0, inPlt = 0;
                logs.forEach(l => {
                    if (l && l.time && l.time.startsWith(dStr)) {
                        const type = String(l.type || '').toUpperCase();
                        let itemPltStd = 40;
                        const item = inventory.find(i => i.id === l.itemId);
                        if (item && item.pltStd) itemPltStd = Number(item.pltStd);
                        const qty = Number(l.plt || 0) + (Number(l.box || 0) / itemPltStd);
                        if (type.includes('OUT')) outPlt += qty;
                        else if (type.includes('IN')) inPlt += qty;
                    }
                });

                // 1순위: 기록(자동 스냅샷 또는 수동 수정값)이 있으면 그대로 사용
                // 2순위: 기록이 없으면 직전 마감 재고를 이월
                if (dailyPltLog[dStr] !== undefined && dailyPltLog[dStr] !== null) {
                    runningInventory = dailyPltLog[dStr];
                } else if (runningInventory !== null) {
                    runningInventory = runningInventory + inPlt - outPlt;
                }

                if (runningInventory !== null) {
                    series[dStr] = Math.ceil(runningInventory);
                }
            }
            return series;
        }
function listOf(value,label){
 if(value===undefined||value===null)return [];
 if(Array.isArray(value))return value.filter(x=>x!==null);
 if(typeof value==='object')return Object.values(value).filter(x=>x!==null);
 throw Error(label+' 자료 형식을 확인해 주세요.');
}
function numeric(value,label,fallback=0){const n=value===undefined||value===null||value===''?fallback:Number(value);if(!Number.isFinite(n))throw Error(label+'의 숫자 형식을 확인해 주세요.');return n}
function prepareSnapshot(data){
 if(!data||typeof data!=='object'||Array.isArray(data)||data.error)throw Error('서버 자료를 확인할 수 없습니다.');
 const items=listOf(data.inventory,'재고').map(i=>{
  if(!i||typeof i!=='object'||typeof i.id!=='string')throw Error('재고 품목을 확인해 주세요.');
  const def=DEFAULT_ITEMS.find(d=>d.id===i.id)||{};
  return {...i,name:String(i.name??i.id),box:numeric(i.box,'재고'),pcs:numeric(i.pcs,'낱개'),piece:numeric(i.piece,'낱개',def.piece||0),pltStd:numeric(i.pltStd,'파렛트 규격',40)};
 });
 if(items.some(i=>i.pltStd<=0))throw Error('파렛트 규격을 확인해 주세요.');
 // The administrator displays these default items too. This normalization stays in memory.
 if(IS_LUNOX){const ids=new Set(items.map(i=>i.id));DEFAULT_ITEMS.forEach(d=>{if(!ids.has(d.id))items.push({...d})})}
 const records=listOf(data.logs,'입출고').map(l=>{
  if(!l||typeof l!=='object'||typeof l.time!=='string'||!/^\d{4}-\d{2}-\d{2}/.test(l.time))throw Error('입출고 일자를 확인해 주세요.');
  return {...l,type:String(l.type??''),fee:numeric(l.fee,'작업 금액'),plt:numeric(l.plt,'파렛트'),box:numeric(l.box,'박스'),pcs:numeric(l.pcs,'낱개')};
 });
 function dateMap(raw){const result={};if(raw===undefined||raw===null)return result;if(typeof raw!=='object'||Array.isArray(raw))throw Error('일별 보관 자료를 확인해 주세요.');for(const [date,value] of Object.entries(raw)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('보관 일자를 확인해 주세요.');if(value!==null)result[date]=numeric(value,'보관 수량')}return result}
 const daily=dateMap(data.dailyPltLog),manual=IS_LUNOX?{}:dateMap(data.manualStorageLog);
 const visible=items.filter(i=>!IS_LUNOX||i.id!=='in_40ft');
 const today=getFormattedDate();
 // Match finishLoading() in the administrator app without saving this derived row.
 if(!daily[today])daily[today]=visible.reduce((sum,i)=>sum+Math.ceil(i.box/i.pltStd),0);
 return {inventory:items,logs:records,dailyPltLog:daily,manualStorageLog:manual};
}
async function fetchData(){
 if(fetching)return;
 fetching=true;$('refreshGuest').disabled=true;
 if(!loaded)$('cloudStatus').textContent='서버 자료를 불러오는 중입니다…';
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{
  const response=await fetch(FIREBASE_URL,{method:'GET',cache:'no-store',signal:controller.signal});
  if(!response.ok)throw Error(response.status===401||response.status===403?'조회 권한을 확인해 주세요.':'서버 응답 오류 ('+response.status+')');
  const next=prepareSnapshot(await response.json());
  inventory=next.inventory;logs=next.logs;dailyPltLog=next.dailyPltLog;manualStorageLog=next.manualStorageLog;
  loaded=true;lastSync=new Date().toLocaleTimeString('ko-KR');
  $('cloudStatus').textContent='정상 연결 · 마지막 갱신 '+lastSync+' · 15초마다 자동 갱신';
  $('cloudStatus').className='fixed top-0 left-0 w-full bg-emerald-600 text-white text-xs text-center py-1 z-50';
  render();
 }catch(e){
  $('cloudStatus').textContent='연결 실패 · '+(e.name==='AbortError'?'응답 시간이 초과되었습니다.':e.message)+(loaded?' · 마지막으로 확인한 자료를 표시합니다 ('+lastSync+')':' · 새로고침으로 다시 시도해 주세요.');
  $('cloudStatus').className='fixed top-0 left-0 w-full bg-red-600 text-white text-xs text-center py-1 z-50';
 }finally{clearTimeout(timer);fetching=false;$('refreshGuest').disabled=false}
}
function isInbound(l){return l.type==='IN'}
function monthlyTotals(){
 const series=buildMonthlyStorage(currentSelectedMonth);
 let storage=0,inFee=0,outFee=0;
 Object.values(series).forEach(n=>storage+=Number(n||0)*700);
 logs.forEach(l=>{if(l.time.startsWith(currentSelectedMonth)){if(isInbound(l))inFee+=l.fee;if(l.type==='OUT')outFee+=l.fee}});
 return {series,storage,inFee,outFee,total:storage+inFee+outFee};
}
function visibleInventory(){return inventory.filter(i=>!IS_LUNOX||i.id!=='in_40ft')}
function renderInventory(){
 const all=visibleInventory(),query=$('inventorySearch').value.trim().toLowerCase();
 const items=all.filter(i=>i.name.toLowerCase().includes(query));
 const plt=all.reduce((sum,i)=>sum+Math.ceil(i.box/i.pltStd),0);
 const billing=!IS_LUNOX&&manualStorageLog[getFormattedDate()]!==undefined?manualStorageLog[getFormattedDate()]:plt;
 $('todayPltBadge').textContent='현재 '+fmt(plt)+' PLT'+(!IS_LUNOX?' · 당일 청구 '+fmt(billing)+' PLT':'');
 $('inventoryTable').innerHTML=items.map(i=>`<tr class="border-b"><td class="p-3 font-bold">${escapeText(i.name)}</td><td class="p-3 text-right text-blue-700 font-bold">${fmt(i.box)}</td><td class="p-3 text-right">${fmt(IS_LUNOX?i.piece:i.pcs)}</td><td class="p-3 text-center">${fmt(i.pltStd)}</td><td class="p-3 text-center font-bold">${fmt(Math.ceil(i.box/i.pltStd))} PLT</td></tr>`).join('')||'<tr><td colspan="5" class="p-5 text-center text-gray-500">조회되는 품목이 없습니다.</td></tr>';
 $('inventoryCards').innerHTML=items.map(i=>`<div class="bg-white border rounded-lg p-4"><div class="flex justify-between gap-3"><h4 class="font-bold">${escapeText(i.name)}</h4><span class="text-sm font-bold whitespace-nowrap">${fmt(Math.ceil(i.box/i.pltStd))} PLT</span></div><p class="mt-2 text-sm">박스 <b>${fmt(i.box)}</b> · 낱개 <b>${fmt(IS_LUNOX?i.piece:i.pcs)}</b> · 1 PLT 기준 ${fmt(i.pltStd)}박스</p></div>`).join('')||'<p class="p-4 text-gray-500">조회되는 품목이 없습니다.</p>';
}
function filteredLogs(){
 const date=$('searchDate').value,type=$('historyType').value,query=$('historySearch').value.trim().toLowerCase();
 return logs.filter(l=>l.time.startsWith(date||currentSelectedMonth)&&(type==='ALL'||(type==='IN'?isInbound(l):l.type==='OUT'))&&[l.text,l.memo,l.itemName,inventory.find(i=>i.id===l.itemId)?.name].some(v=>String(v??'').toLowerCase().includes(query))).sort((a,b)=>b.time.localeCompare(a.time));
}
function renderLogs(){
 const rows=filteredLogs(),groups=new Map();rows.forEach(l=>{const day=l.time.slice(0,10);if(!groups.has(day))groups.set(day,[]);groups.get(day).push(l)});
 $('logTitleMonth').textContent=currentSelectedMonth.replace('-','.');$('historyCount').textContent=fmt(rows.length)+'개 기록';
 $('logContainer').innerHTML=[...groups].map(([day,records])=>`<section class="mb-4"><h4 class="bg-slate-800 text-white rounded-lg p-2 font-bold">${escapeText(day)} <span class="font-normal text-xs ml-2">입고비 ${fmt(records.filter(isInbound).reduce((n,l)=>n+l.fee,0))}원 · 출고비 ${fmt(records.filter(l=>l.type==='OUT').reduce((n,l)=>n+l.fee,0))}원</span></h4>${records.map(l=>`<article class="p-3 bg-white border-l-4 ${l.type==='OUT'?'border-blue-400':'border-green-400'} rounded shadow-sm mt-2"><div class="flex justify-between gap-3"><p class="font-bold break-words min-w-0">${escapeText(l.text||l.itemName||inventory.find(i=>i.id===l.itemId)?.name||l.type)}</p><strong class="text-indigo-700 whitespace-nowrap">${fmt(l.fee)}원</strong></div><p class="text-xs text-gray-500 mt-1">${escapeText(l.time)}</p>${l.memo?'<p class="text-xs text-gray-600 mt-2 bg-gray-50 p-2 border rounded whitespace-pre-wrap break-words">'+escapeText(l.memo)+'</p>':''}</article>`).join('')}</section>`).join('')||'<div class="p-6 text-center text-gray-500">조건에 맞는 내역이 없습니다.</div>';
}
function render(){
 const months=new Set([getFormattedDate().slice(0,7),currentSelectedMonth]);logs.forEach(l=>months.add(l.time.slice(0,7)));Object.keys(dailyPltLog).forEach(d=>months.add(d.slice(0,7)));Object.keys(manualStorageLog).forEach(d=>months.add(d.slice(0,7)));
 $('monthSelector').innerHTML=[...months].sort().reverse().map(m=>`<option value="${m}" ${m===currentSelectedMonth?'selected':''}>${m.replace('-','년 ')}월 내역</option>`).join('');
 const t=monthlyTotals();$('monthlyTotalRevenue').textContent=fmt(t.total);$('monthlyStorageFee').textContent=fmt(t.storage);$('monthlyInFee').textContent=fmt(t.inFee);$('monthlyOutFee').textContent=fmt(t.outFee);
 renderInventory();renderLogs();if(activeDetail)renderDetail();
}
function handleMonthChange(){currentSelectedMonth=$('monthSelector').value;$('searchDate').value='';render()}
function handleDateChange(){if($('searchDate').value)currentSelectedMonth=$('searchDate').value.slice(0,7);render()}
function resetHistoryFilters(){$('searchDate').value='';$('historyType').value='ALL';$('historySearch').value='';renderLogs()}
function openStorageModal(){if(!loaded)return;activeDetail='STORAGE';renderDetail();$('storageModal').style.display='flex';$('storageClose').focus()}
function closeStorageModal(){$('storageModal').style.display='none';activeDetail=null;$('viewStorage').focus()}
function openInOutModal(type){if(!loaded)return;activeDetail=type;renderDetail();$('inOutModal').style.display='flex';$('inOutClose').focus()}
function closeInOutModal(){const previous=activeDetail;$('inOutModal').style.display='none';activeDetail=null;$(previous==='IN'?'viewIn':'viewOut').focus()}
function renderDetail(){
 if(activeDetail==='STORAGE'){
  $('storageModalTitle').textContent=currentSelectedMonth+' 보관료 상세';const t=monthlyTotals();
  $('storageModalBody').innerHTML=Object.entries(t.series).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,plt])=>`<tr class="border-b"><td class="p-2">${date}${manualStorageLog[date]!==undefined?' <small class="text-amber-700">조정</small>':''}</td><td class="p-2 text-center">${fmt(plt)} PLT</td><td class="p-2 text-right">${fmt(plt*700)}원</td></tr>`).join('')||'<tr><td colspan="3" class="p-4 text-center">내역 없음</td></tr>';
 }else{
  $('inOutModalTitle').textContent=currentSelectedMonth+(activeDetail==='IN'?' 입고비 상세':' 출고비 상세');
  const rows=logs.filter(l=>l.time.startsWith(currentSelectedMonth)&&(activeDetail==='IN'?isInbound(l):l.type==='OUT')).sort((a,b)=>b.time.localeCompare(a.time));
  $('inOutModalBody').innerHTML=rows.map(l=>`<tr class="border-b"><td class="p-2 text-xs">${escapeText(l.time)}</td><td class="p-2 text-xs">${escapeText(l.text||l.itemName||l.type)}</td><td class="p-2 text-right whitespace-nowrap">${fmt(l.fee)}원</td></tr>`).join('')||'<tr><td colspan="3" class="p-4 text-center">내역 없음</td></tr>';
 }
}
document.addEventListener('DOMContentLoaded',()=>{fetchData();setInterval(()=>{if(!document.hidden)fetchData()},15000)});
window.addEventListener('focus',fetchData);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(activeDetail==='STORAGE')closeStorageModal();else if(activeDetail)closeInOutModal()}});

</script>
</body>
</html>
